spring:
  application:
    name: deen-sa
  flyway:
    # V22 shipped after V27/V28; existing databases must still apply it.
    out-of-order: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.json.format_mapper: jackson

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-4.1-mini}
  escalation-model: ${OPENAI_ESCALATION_MODEL:gpt-4.1-mini}
  escalation-confidence: ${OPENAI_ESCALATION_CONFIDENCE:0.55}
  transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics

app:
  expense-chat:
    model: ${EXPENSE_CHAT_MODEL:${OPENAI_MODEL:gpt-4.1-mini}}
  investments:
    sip-scheduling-enabled: ${APP_INVESTMENTS_SIP_SCHEDULING_ENABLED:false}
  aggregation:
    scheduling-enabled: ${APP_AGGREGATION_SCHEDULING_ENABLED:false}
    daily-cron: ${APP_AGGREGATION_DAILY_CRON:0 0 1 * * *}
    dirty-cron: ${APP_AGGREGATION_DIRTY_CRON:0 */15 * * * *}
    dirty-batch-size: ${APP_AGGREGATION_DIRTY_BATCH_SIZE:100}
    time-zone: ${APP_AGGREGATION_TIME_ZONE:Asia/Kolkata}
  ai-credits:
    enabled: ${AI_CREDITS_ENABLED:true}
    input-per-million: ${AI_CREDITS_INPUT_PER_MILLION:0}
    cached-per-million: ${AI_CREDITS_CACHED_PER_MILLION:0}
    output-per-million: ${AI_CREDITS_OUTPUT_PER_MILLION:0}
    daily-limit: ${AI_CREDITS_DAILY_LIMIT:0}
    request-limit: ${AI_CREDITS_REQUEST_LIMIT:10}
    requests-per-minute: ${AI_CREDITS_REQUESTS_PER_MINUTE:6}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  web:
    base-url: ${APP_WEB_BASE_URL}
    magic-link-expiry: ${APP_MAGIC_LINK_EXPIRY}
    session-expiry: ${APP_WEB_SESSION_EXPIRY}
    secure-cookies: ${APP_WEB_SECURE_COOKIES}
    cookie-same-site: ${APP_WEB_COOKIE_SAME_SITE}
    action-context-expiry: ${APP_ACTION_CONTEXT_EXPIRY:30m}

whatsapp:
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  destination-number: ${WHATSAPP_DESTINATION_NUMBER:}
  api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com}

logging:
  level:
    root: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.type.descriptor.sql: OFF

server:
  port: ${PORT:8080}
