# Opt-in profile for tests that call the real OpenAI Responses API.
# OPENAI_API_KEY must be supplied through the environment; never put it in this file.
openai.api-key=${OPENAI_API_KEY:missing-live-model-api-key}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.model=${LIVE_MODEL_NAME:gpt-4.1-mini}

# WhatsApp remains local and observable through WireMock.
whatsapp.access-token=test-access-token
whatsapp.phone-number-id=test-phone-id
whatsapp.api-base-url=http://localhost:9091
wiremock.admin-url=http://localhost:9091/__admin

# Keep the live-test console focused on the WhatsApp conversations printed by ExpenseLiveIT and SareeLiveIT.
spring.main.banner-mode=off
logging.level.root=OFF
logging.level.com.apps.deen_sa=OFF
logging.level.org.springframework=OFF
logging.level.org.hibernate=OFF
logging.level.org.flywaydb=OFF
