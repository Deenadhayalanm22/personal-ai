spring.datasource.url=jdbc:postgresql://localhost:5433/test_db
spring.datasource.username=test_user
spring.datasource.password=test_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true

# The test client is pointed at WireMock; no real LLM key or request is needed.
openai.api-key=test-api-key
openai.base-url=http://localhost:9091/v1
wiremock.admin-url=http://localhost:9091/__admin
whatsapp.access-token=test-access-token
whatsapp.phone-number-id=test-phone-id
whatsapp.api-base-url=http://localhost:9091
server.port=8080
