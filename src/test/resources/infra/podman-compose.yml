services:
  postgres:
    image: postgres:16-alpine
    container_name: it-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
  wiremock:
    image: wiremock/wiremock:3.6.0
    container_name: personal-ai-it-wiremock
    ports:
      - "9091:8080"
    volumes:
      - ../wiremock:/home/wiremock
